name: Bug report
description: Report a reproducible defect
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior and why it is a problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Open…\n2. Tap…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
  - type: input
    id: device
    attributes:
      label: Device and Android version
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed private data, secrets, and personal records from this report.
          required: true
